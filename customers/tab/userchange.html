<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Thay đổi tài khoản</title>

<link
rel="stylesheet"
href="../css/customers.css">

</head>


<body>


<div class="cus-login-page">


<div class="cus-login-box">


<div class="cus-login-header">

🔑 THAY ĐỔI TÀI KHOẢN

</div>



<div class="cus-login-body">



<div class="cus-form-group">

<label>
Tên đăng nhập cũ
</label>

<input
id="old-username"
class="cus-input"
type="text">

</div>




<div class="cus-form-group">

<label>
Mật khẩu cũ
</label>

<input
id="old-password"
class="cus-input"
type="password">

</div>




<hr>



<div class="cus-form-group">

<label>
Tên đăng nhập mới
</label>

<input
id="new-username"
class="cus-input"
type="text">

</div>




<div class="cus-form-group">

<label>
Mật khẩu mới
</label>

<input
id="new-password"
class="cus-input"
type="password">

</div>




<div class="cus-form-group">

<label>
Xác nhận mật khẩu mới
</label>

<input
id="confirm-password"
class="cus-input"
type="password">

</div>



</div>




<div class="cus-login-footer">


<button
id="btn-change"
class="cus-btn cus-btn-success">

Cập nhật tài khoản

</button>



<button
id="btn-cancel"
class="cus-btn cus-btn-secondary">

Cancel

</button>


</div>



</div>


</div>




<script
type="module"
src="../js/userchange.js">

</script>


</body>

</html>
