<div class="hosoview-page">


<div class="hosoview-box">

    <h1>Hồ sơ thành viên</h1>

    <!-- TRẠNG THÁI XÉT DUYỆT -->
    <div
        id="view-status"
        class="hosoview-status hosoview-status-pending">
        ⏳ Đang chờ xét duyệt
    </div>

<!--==================================================
    THÔNG BÁO TỪ ADMIN
==================================================-->

<div
    id="view-admin-message"
    class="hosoview-admin-message"
    style="display:none;">

    <div class="hosoview-admin-message-title">
        📢 Thông báo từ Admin
    </div>

    <div
        id="view-admin-message-text"
        class="hosoview-admin-message-text">
    </div>

</div>

    <div class="hosoview-avatar">
        <img
            id="view-avatar"
            src=""
            alt="Ảnh đại diện">
    </div>

    <div class="hosoview-form">

        <div class="hosoview-group">
            <label>ID</label>
            <div
                class="hosoview-value"
                id="view-id">
            </div>
        </div>

        <div class="hosoview-group">
            <label>User name</label>
            <div
                class="hosoview-value"
                id="view-username">
            </div>
        </div>

        <div class="hosoview-group">
            <label>Họ và tên</label>
            <div
                class="hosoview-value"
                id="view-fullname">
            </div>
        </div>

        <div class="hosoview-group">
            <label>Giới tính</label>
            <div
                class="hosoview-value"
                id="view-gender">
            </div>
        </div>

        <div class="hosoview-group">
            <label>Nơi sinh sống</label>
            <div
                class="hosoview-value"
                id="view-address">
            </div>
        </div>

        <div class="hosoview-group">
            <label>Quốc tịch</label>
            <div
                class="hosoview-value"
                id="view-nationality">
            </div>
        </div>

        <div class="hosoview-group">
            <label>Điện thoại</label>
            <div
                class="hosoview-value"
                id="view-phone">
            </div>
        </div>

        <div class="hosoview-group">
            <label>Gmail</label>
            <div
                class="hosoview-value"
                id="view-gmail">
            </div>
        </div>

        <div class="hosoview-group">
            <label>Zalo</label>
            <div
                class="hosoview-value"
                id="view-zalo">
            </div>
        </div>

        <div class="hosoview-group">
            <label>Facebook</label>
            <div
                class="hosoview-value"
                id="view-facebook">
            </div>
        </div>

    </div>

</div>
