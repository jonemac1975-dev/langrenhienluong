<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hồ sơ thành viên</title>
<link rel="stylesheet" href="../css/customers.css">
</head>
<body>
<div class="hoso-page">

<div class="hoso-box">

<h1>Hồ sơ thành viên</h1>

<div id="hoso-status" class="hoso-status">
    ⏳ Đang chờ xét duyệt
</div>

<div class="hoso-form">

<div class="hoso-form">
<div class="hoso-group">
<label for="hoso-id">ID</label>
<input type="text" id="hoso-id" disabled> </div>

<div class="hoso-group">
<label for="hoso-username">User name</label>
<input type="text"id="hoso-username"disabled></div>

<div class="hoso-group">
<label for="hoso-name">Họ và tên</label>
<input type="text" id="hoso-name" placeholder="Nhập họ và tên"> </div>

<div class="hoso-group">
<label>Ảnh</label>
<input id="hoso-image-file" type="file" accept="image/*">
<br><br>
<img id="hoso-preview">
</div>

<div class="hoso-group">
<label>Giới tính</label>
<div class="hoso-gender">

<label>
<input type="radio" name="gender" id="hoso-male" value="Nam"> Nam </label>

<label>
<input type="radio" name="gender" id="hoso-female" value="Nữ"> Nữ </label>
</div>
</div>

<div class="hoso-group">
<label for="hoso-address">
Nơi sinh sống
</label>

<input
type="text"
id="hoso-address"
placeholder="Nhập nơi đang sinh sống">
</div>

<div class="hoso-group">
<label for="hoso-nationality">
Quốc tịch
</label>

<input
type="text"
id="hoso-nationality"
placeholder="Nhập quốc tịch">
</div>

<div class="hoso-group">
<label for="hoso-phone">
Điện thoại
</label>

<input
type="tel"
id="hoso-phone"
placeholder="Nhập số điện thoại">
</div>

<div class="hoso-group">
<label for="hoso-gmail">
Gmail
</label>

<input
type="email"
id="hoso-gmail"
placeholder="Nhập địa chỉ Gmail">
</div>

<div class="hoso-group">
<label for="hoso-zalo">
Zalo
</label>

<input
type="text"
id="hoso-zalo"
placeholder="Nhập Zalo">
</div>

<div class="hoso-group">
<label for="hoso-facebook">
Facebook
</label>

<input
type="text"
id="hoso-facebook"
placeholder="Nhập Facebook">
</div>

<div class="hoso-group">
<label for="hoso-gioithieu">
Giới thiệu ngắn bản thân
</label>

<input
type="text"
id="hoso-gioithieu"
placeholder="Giới thiệu ngắn bản thân">
</div>

<div class="hoso-buttons">

<button
type="button"
id="btn-save">
💾 Lưu
</button>

<button
type="button"
id="btn-my-page">
🏠 Trang của tôi
</button>

<button
type="button"
id="btn-hoso-home">
🌐 Home
</button>

</div>

</div>

</div>

</div>


</body>
</html>
