<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Đăng nhập</title>

<link rel="stylesheet" href="../css/customers.css">

</head>


<body>


<div class="cus-login-page">


<div class="cus-login-box">


<div class="cus-login-header">

🔐 ĐĂNG NHẬP

</div>



<div class="cus-login-body">


<div class="cus-form-group">

<label>

Tên đăng nhập

</label>


<input
id="login-username"
class="cus-input"
type="text">


</div>



<div class="cus-form-group">

<label>

Mật khẩu

</label>


<input
id="login-password"
class="cus-input"
type="password">


</div>


</div>



<div class="cus-login-footer">


<button
id="btn-login"
class="cus-btn cus-btn-success">

OK

</button>



<button
id="btn-cancel"
class="cus-btn cus-btn-secondary">

Cancel

</button>



</div>


</div>


</div>



<script
type="module"
src="../js/userlogin.js">

</script>


</body>

</html>
