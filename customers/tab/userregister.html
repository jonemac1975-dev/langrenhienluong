<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Đăng ký tài khoản</title>

<link
rel="stylesheet"
href="../css/customers.css">

</head>

<body>

<div class="cus-login-page">

    <div class="cus-login-box">

        <div class="cus-login-header">

            📝 ĐĂNG KÝ TÀI KHOẢN

        </div>

        <div class="cus-login-body">

            <div class="cus-form-group">

                <label>

                    Tên đăng ký

                </label>

                <input
                    id="reg-username"
                    class="cus-input"
                    type="text">

            </div>

            <div class="cus-form-group">

                <label>

                    Mật khẩu

                </label>

                <input
                    id="reg-password"
                    class="cus-input"
                    type="password">

            </div>

            <div class="cus-form-group">

                <label>

                    Xác nhận

                </label>

                <input
                    id="reg-confirm"
                    class="cus-input"
                    type="password">

            </div>

        </div>

        <div class="cus-login-footer">

            <button
                id="btn-register"
                class="cus-btn cus-btn-success">

                Đăng ký

            </button>

            <button
                id="btn-cancel"
                class="cus-btn cus-btn-secondary">

                Hủy

            </button>

        </div>

    </div>

</div>

<script type="module"src="../js/userregister.js"> </script>

</body>

</html>
