<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Trang cập nhật hoạt động Hàng Kỉnh</title>
<link rel="stylesheet" href="../css/hangkinh.css">
</head>
<body>

<header class="hk-header">
    <h1>Trang cập nhật hoạt động Hàng Kỉnh</h1>
    <button type="button" id="hk-home">🏠 Home</button>
</header>

<main class="hk-container">

    <section class="hk-form">

        <div class="hk-row">
            <label>ID</label>
            <input id="hk-id" type="text" readonly>
        </div>

        <div class="hk-row">
            <label>USER</label>
            <input id="hk-user" type="text" readonly>
        </div>

        <div class="hk-action">
            <button type="button" id="hk-update">
                Cập nhật hoạt động
            </button>
        </div>

    </section>

</main>

<script type="module" src="../js/hangkinh.js"></script>
</body>
</html>
