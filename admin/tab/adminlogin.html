<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>ADMIN LOGIN</title>

<link
rel="stylesheet"
href="../css/admin.css">

</head>

<body>

<div class="adm-login-page">

    <div class="adm-login-box">

        <div class="adm-login-header">

            🔒 ADMIN LOGIN

        </div>

        <div class="adm-login-body">

            <div class="adm-form-group">

                <label>

                    Password

                </label>

                <input
                    id="admin-pass"
                    class="adm-input"
                    type="password"
                    placeholder="Nhập mật khẩu">

            </div>

        </div>

        <div class="adm-login-footer">

            <button
                id="btn-login"
                class="adm-btn adm-btn-save">

                OK

            </button>

            <button
                id="btn-cancel"
                class="adm-btn adm-btn-delete">

                Cancel

            </button>

        </div>

    </div>

</div>

<script
type="module"
src="../js/adminlogin.js">

</script>

</body>

</html>
