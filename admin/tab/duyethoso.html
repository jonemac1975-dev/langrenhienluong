<div class="duyet-hoso-page">

    <div class="duyet-hoso-box">

        <h2 class="duyet-hoso-title">
            📚 DUYỆT HỒ SƠ THÀNH VIÊN
        </h2>


        <!--==================================================
            DANH SÁCH
        ==================================================-->

        <div class="duyet-hoso-list">

            <table class="duyet-hoso-table">

                <thead>

                    <tr>
                        <th>STT</th>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Họ và tên</th>
                        <th>Nơi sinh sống</th>
                        <th>Điện thoại</th>
                        <th>Trạng thái</th>
                        <th>Xem hồ sơ</th>
                        <th>Duyệt</th>
                    </tr>

                </thead>


                <tbody id="duyet-hoso-body">

                    <tr>
                        <td colspan="9">
                            Đang tải dữ liệu...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>


        <!--==================================================
            CHI TIẾT HỒ SƠ
        ==================================================-->

        <div
            id="duyet-hoso-detail"
            class="duyet-hoso-detail"
            style="display:none;">

            <div class="duyet-detail-header">

                <h3>
                    👤 Thông tin hồ sơ thành viên
                </h3>

                <button
                    type="button"
                    id="btn-close-duyet-detail">
                    ✖ Đóng
                </button>

            </div>


            <div class="duyet-detail-content">

                <div class="duyet-detail-avatar">

                    <img
                        id="dh-avatar"
                        src=""
                        alt="Ảnh đại diện">

                </div>


                <div class="duyet-detail-grid">

                    <div>
                        <label>ID</label>
                        <input id="dh-id" readonly>
                    </div>

                    <div>
                        <label>Username</label>
                        <input id="dh-username" readonly>
                    </div>

                    <div>
                        <label>Họ và tên</label>
                        <input id="dh-fullname" readonly>
                    </div>

                    <div>
                        <label>Giới tính</label>
                        <input id="dh-gender" readonly>
                    </div>

                    <div>
                        <label>Nơi sinh sống</label>
                        <input id="dh-address" readonly>
                    </div>

                    <div>
                        <label>Quốc tịch</label>
                        <input id="dh-nationality" readonly>
                    </div>

                    <div>
                        <label>Điện thoại</label>
                        <input id="dh-phone" readonly>
                    </div>

                    <div>
                        <label>Gmail</label>
                        <input id="dh-gmail" readonly>
                    </div>

                    <div>
                        <label>Zalo</label>
                        <input id="dh-zalo" readonly>
                    </div>

                    <div>
                        <label>Facebook</label>
                        <input id="dh-facebook" readonly>
                    </div>

                    <div>
                        <label>Giới thiệu</label>

                        <textarea
                            id="dh-gioithieu"
                            readonly>
                        </textarea>

                    </div>

                    <div>
                        <label>Ngày tạo</label>
                        <input id="dh-created" readonly>
                    </div>

                    <div>
                        <label>Cập nhật</label>
                        <input id="dh-updated" readonly>
                    </div>

                    <div>
                        <label>Trạng thái</label>
                        <input id="dh-status" readonly>
                    </div>

                </div>

            </div>

        </div>


        <!--==================================================
            THÔNG BÁO CHO THÀNH VIÊN
        ==================================================-->

        <div class="duyet-admin-message">

            <label for="dh-admin-message">
                📢 Thông báo cho thành viên
            </label>

            <textarea
                id="dh-admin-message"
                rows="4"
                placeholder="Nhập thông báo cho thành viên chưa được duyệt...">
            </textarea>

            <button
                type="button"
                id="btn-save-admin-message">
                💾 Gửi thông báo
            </button>

        </div>

    </div>

</div>
