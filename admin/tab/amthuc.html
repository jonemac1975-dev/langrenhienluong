<div class="at-box">

<h2 class="at-title">
🍜 CẬP NHẬT ẨM THỰC MÓN ĂN
</h2>

<div class="at-row">
<label>Tên món</label>
<input id="at-name" class="gt-input">
</div>

<div class="at-row">
<label>Ảnh đại diện</label>
<input id="at-image-file" type="file" accept="image/*">
<br><br>
<img id="at-preview">
</div>

<div class="at-row">
<label>Mô tả nguồn gốc</label>
<div id="at-editor"></div>
</div>

<div class="at-row">
<label>Địa chỉ quán</label>
<textarea
    id="at-address"
    class="gt-input"
    rows="4"
    placeholder="Nhập địa chỉ..."
></textarea>
</div>

<div class="at-row">
<label>Link Video</label>
<input id="at-video" class="gt-input">
</div>

<div class="at-row">
<label>Link Google Maps</label>
<input id="at-map" class="gt-input">
</div>

<div class="gt-btn-area">
<button id="btn-at-save" class="gt-btn gt-btn-save">
💾 Thêm / Lưu
</button>
</div>

<hr>

<h3>Danh sách món ăn</h3>
<table class="ls-table">
<thead>
<tr>
<th width="60">STT</th>
<th width="220">Tên món</th>
<th width="250">Địa chỉ</th>
<th width="120">Google Maps</th>
<th width="120">Video</th>
<th width="170">Hành động</th>
</tr>
</thead>
<tbody id="at-body">
</tbody>
</table>
</div>
