<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>ADMIN CHANGE</title>

<link
rel="stylesheet"
href="../css/admin.css">

</head>

<body>

<div class="adm-login-page">

    <div class="adm-login-box">

        <div class="adm-login-header">

            🔑 ADMIN CHANGE

        </div>

        <div class="adm-login-body">

            <div class="adm-form-group">

                <label>

                    Pass cũ

                </label>

                <input
                    id="old-pass"
                    class="adm-input"
                    type="password">

            </div>

            <div class="adm-form-group">

                <label>

                    Pass mới

                </label>

                <input
                    id="new-pass"
                    class="adm-input"
                    type="password">

            </div>

            <div class="adm-form-group">

                <label>

                    Xác nhận

                </label>

                <input
                    id="confirm-pass"
                    class="adm-input"
                    type="password">

            </div>

        </div>

        <div class="adm-login-footer">

            <button
                id="btn-ok"
                class="adm-btn adm-btn-save">

                OK

            </button>

            <button
                id="btn-cancel"
                class="adm-btn adm-btn-delete">

                Cancel

            </button>

        </div>

    </div>

</div>

<script
type="module"
src="../js/adminchange.js">

</script>

</body>

</html>
